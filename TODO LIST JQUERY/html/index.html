<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="text-center mb-4">Lista de Tareas</h1>
        <!-- Input para añadir tareas -->
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="nuevaTarea" placeholder="Escribe una nueva tarea">
          <button class="btn btn-primary" id="botonAñadir">Añadir</button>
        </div>
        <!-- Filtros -->
        <div class="d-flex justify-content-center mb-3">
          <button class="btn btn-outline-primary me-2 active" FiltrarDatos="Todos">Todas</button>
          <button class="btn btn-outline-success me-2" FiltrarDatos="Completados">Completadas</button>
          <button class="btn btn-outline-warning" FiltrarDatos="Pendientes">Pendientes</button>
        </div>
        <!-- Lista de tareas -->
        <ul class="list-group" id="listaTareas"></ul>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
